# Главный переключатель плагина.
# true — сервер доступен только игрокам из белого списка.
# false — белый список отключен, зайти могут все.
enabled: true

# Общий статус интеграции
integration:
  bot_token: "YOUR_BOT_TOKEN"

# Управление правами и доступами в Discord
access_control:
  # Категория, где разворачиваются текстовые каналы с заявками
  target_category_id: 123456789012345678
  
  # Группы персонала, имеющие право одобрять/отклонять анкеты
  staff_roles:
    - 123456789012345678 # Модератор
    - 123456789012345678 # Администратор

  # Роль, автоматически присваиваемая пользователю после успешного одобрения
  reward_role_id: 123456789012345678

# Настройки интерактивного интерфейса (Модальные окна и Кнопки)
interface:
  # Заголовок всплывающей формы заполнения
  modal_title: "Верификация аккаунта"

# Конфигурация создаваемого канала-тикета
ticket_channels:
  # Шаблон названия приватной комнаты (Переменные: {user_name}, {user_id})
  naming_format: "🎫-заявка-{user_name}"

# Аудит и логирование действий
audit_logging:
  # Канал для вывода финальных вердиктов (принят/отклонен)
  log_channel_id: 123456789012345678

# Конструктор анкетных вопросов (Максимум 5 вопросов для Discord Modals)
# Для захвата никнейма, используйте название "minecraft_nick"
application_form:
  questions:
    minecraft_nick:
      label: "Ваш точный игровой никнейм"
      placeholder: "Пример: Notch"
      field_type: SHORT # Доступно: SHORT (строка), PARAGRAPH (абзац)
      min_length: 3
      max_length: 16
      required: true