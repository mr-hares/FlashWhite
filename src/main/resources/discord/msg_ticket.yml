#  type  Компонент      Описание
#  1	 Action Row     Ряд для кнопок или селектов
#  2	 Button         Кнопка
#  10	 Text Display   Отображение Markdown-текста
#  12	 Media Gallery  Галерея медиа
#  14	 Separator      Отступ между компонентами
#  17	 Container      Визуальная группировка компонентов

# custom_id  Значение
# ACCEPT     Кнопка для одобрения тикета
# DECLINE    Кнопка для отказа тикета

# style_id   Цвет
# 1          Акцент дискорда
# 2          Серый
# 3          Зелёный
# 4          Красный

# Массив, содержащий все компоненты вашего сообщения
components:
  - type: 17
    components:
      - type: 10
        content: "## Канал заявки\nДобро пожаловать в персональный тикет, {user_mention}!\n 
        **Статус:** Ожидание рассмотрения"

      - type: 14
        divider: true

      - type: 10
        content: "**Игровой никнейм**\n```{minecraft_nick}```"

      - type: 14
        divider: true

      - type: 1
        components:
          - type: 2
            style: 3
            label: "Утвердить"
            emoji: ""
            custom_id: ACCEPT
          - type: 2
            style: 4
            label: "Отклонить"
            emoji: ""
            custom_id: DECLINE