#  type  Компонент      Описание
#  1	 Action Row     Ряд для кнопок или селектов
#  2	 Button         Кнопка
#  10	 Text Display   Отображение Markdown-текста
#  12	 Media Gallery  Галерея медиа
#  14	 Separator      Отступ между компонентами
#  17	 Container      Визуальная группировка компонентов

# custom_id  Значение
# CREATE     Кнопка для создания тикета

# style_id   Цвет
# 1          Акцент дискорда
# 2          Серый
# 3          Зелёный
# 4          Красный

# Массив, содержащий все компоненты вашего сообщения
components:
  - type: 17
    components:
      - type: 12
        components:
          - image: ""

      - type: 10
        content: "## Подача заявки на Whitelist\nИспользуйте кнопку под сообщением для начала процесса создания заявки."

      - type: 14
        divider: true

      - type: 1
        components:
          - type: 2
            style: 1
            label: "Подать заявление"
            emoji: "✍️"
            custom_id: CREATE